<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4248"/>
      <stop offset="100%" stop-color="#1c2429"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3238"/>
      <stop offset="50%" stop-color="#4a5860"/>
      <stop offset="100%" stop-color="#252c32"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bay)"/>
  <rect x="0" y="520" width="1600" height="380" fill="url(#floor)"/>
  <!-- fluorescent tubes -->
  <rect x="80" y="40" width="420" height="10" rx="2" fill="#e8f0f4" opacity="0.85"/>
  <rect x="590" y="36" width="420" height="12" rx="2" fill="#f4f8fa" opacity="0.95"/>
  <rect x="1100" y="42" width="420" height="10" rx="2" fill="#e8f0f4" opacity="0.8"/>
  <!-- steel columns -->
  <rect x="180" y="80" width="28" height="460" fill="#6b757c"/>
  <rect x="1390" y="80" width="28" height="460" fill="#6b757c"/>
  <!-- lift -->
  <rect x="420" y="380" width="18" height="220" fill="#8d969c"/>
  <rect x="760" y="380" width="18" height="220" fill="#8d969c"/>
  <rect x="400" y="360" width="400" height="24" fill="#9aa3a8"/>
  <!-- vehicle silhouette on lift -->
  <path d="M430 300 h320 l40 60 h-400 z" fill="#1a2228"/>
  <rect x="470" y="250" width="240" height="55" fill="#243038"/>
  <!-- radiator cores on bench -->
  <rect x="980" y="430" width="420" height="90" fill="#4e585f"/>
  <rect x="1000" y="390" width="110" height="70" fill="#c4a035"/>
  <rect x="1130" y="385" width="110" height="75" fill="#b08a28"/>
  <rect x="1260" y="392" width="110" height="68" fill="#9a7a22"/>
  <!-- hose / coolant tray -->
  <rect x="1020" y="500" width="160" height="12" fill="#1B4F8A"/>
  <ellipse cx="240" cy="700" rx="90" ry="18" fill="#151b20" opacity="0.5"/>
</svg>
